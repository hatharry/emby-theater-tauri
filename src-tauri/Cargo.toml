[package]
name = "embytheater"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
hostname = "0.4"

[lib]
name = "embytheater_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
